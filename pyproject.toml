[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project]
name = "meu-servidor-mcp"
version = "0.4.0" # Nova versão para a tentativa final
description = "Um servidor MCP de exemplo para o Smithery."
requires-python = ">=3.12"
dependencies = [
    "annotated-types",
    "anyio",
    "certifi",
    "click",
    "exceptiongroup",
    "h11",
    "httpcore",
    "httpx",
    "httpx-sse",
    "idna",
    "markdown-it-py",
    # A MUDANÇA ESTÁ AQUI:
    "mcp",  # Versão liberada para o instalador escolher a correta
    "mdurl",
    "pydantic",
    "pydantic-settings",
    "pydantic_core",
    "Pygments",
    "python-dotenv",
    "python-multipart",
    "rich",
    "shellingham",
    "sniffio",
    "sse-starlette",
    "starlette",
    "typer",
    "typing-inspection",
    "typing_extensions",
    "uvicorn",
    "smithery>=0.1.23"
]

[tool.smithery]
server = "servidor:create_server"
