[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project]
name = "meu-servidor-mcp"
version = "1.0.0"
description = "Um servidor MCP de exemplo para o Smithery."
requires-python = ">=3.12"
dependencies = [
    # Dependências do seu projeto, com versões liberadas para evitar conflitos
    "annotated-types",
    "anyio",
    "certifi",
    "click",
    "exceptiongroup",
    "h11",
    "httpcore",
    "httpx",
    "httpx-sse",
    "idna",
    "markdown-it-py",
    "mcp", # Versão liberada para resolver o conflito que vimos nos logs
    "mdurl",
    "pydantic",
    "pydantic-settings",
    "pydantic_core",
    "Pygments",
    "python-dotenv",
    "python-multipart",
    "rich",
    "shellingham",
    "sniffio",
    "sse-starlette",
    "starlette",
    "typer", # Versão liberada para resolver o conflito que vimos nos logs
    "typing-inspection",
    "typing_extensions",
    "uvicorn",
    "smithery>=0.1.23" # Necessário para o decorator @smithery.server()
]

# Secção que permite os comandos de teste local `uv run dev` e `uv run playground`
[project.scripts]
dev = "smithery.cli.dev:main"
playground = "smithery.cli.playground:main"

# Secção CRÍTICA que aponta para o nosso servidor
[tool.smithery]
server = "servidor:create_server"
