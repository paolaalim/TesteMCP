name: meu-servidor-mcp
description: "Servidor MCP de demonstração com análise de texto"
version: "1.0.0"

build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."

startCommand:
  type: http
  url: "http://localhost:8080"
  configSchema:
    type: object
    properties:
      port:
        type: number
        default: 8080
        description: "Porta do servidor HTTP"  
